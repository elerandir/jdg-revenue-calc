[package]
name = "kalkulator-jdg"
version = "1.0.0"
description = "Kalkulator przychodów JDG"
authors = []
edition = "2021"

[lib]
name = "kalkulator_jdg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kalkulator-jdg"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
